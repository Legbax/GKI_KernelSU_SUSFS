name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: Wild
      keep_kmi:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      page_size:
        description: "ARM64 page size: 4k (default) or 16k (Kleaf --page_size)"
        required: false
        type: string
        default: "4k"
      stock_config_artifact:
        description: "Artifact name with prefetched stock configs (stock_<kver>[_16k].config)"
        required: false
        type: string
        default: ""

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Prefetched Stock Configs
        if: inputs.stock_config_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.stock_config_artifact }}
          path: stock-configs

      - name: Validate Page Size
        shell: bash
        run: |
          set -euo pipefail
          PAGE_SIZE="${{ inputs.page_size }}"
          case "$PAGE_SIZE" in
            4k) exit 0 ;;
            16k) ;;
            *) echo "ERROR: unsupported page_size '$PAGE_SIZE' (expected 4k or 16k)." >&2; exit 1 ;;
          esac
          # Kleaf exposes --page_size only on the build branches used by these
          # GKI families (main-kernel-build-2023/2024, main-kernel-2025).
          case "${{ inputs.version }}" in
            android14-6.1|android15-6.6|android16-6.12|android17-6.18) ;;
            *)
              echo "ERROR: page_size=16k is not supported for ${{ inputs.version }}." >&2
              echo "Supported families: android14-6.1, android15-6.6, android16-6.12, android17-6.18." >&2
              exit 1
              ;;
          esac

      # Runs on every leg, trimmed to the parts that pay for themselves.
      # Measured from a leg's own log: the full option set took 106 s to recover
      # 39.8 GB, of which the package globs (postgresql*/mysql*/*llvm*/
      # temurin-*/dotnet-sdk-*) were 46 s for 6.4 GB -- the slowest and least
      # space-efficient part. Dropping them leaves ~54 s for ~32 GB, and the
      # explicit package names still remove the browsers and cloud CLIs.
      # Runner budget for reference: 145 GB disk, ~55 GB used by the image, so
      # ~90 GB free before this step and ~114 GB after it (the 16 GiB LTO
      # swapfile takes 16 GB back). The kleaf families are the reason to keep it
      # on all 621 legs even though the legacy ones have room to spare.
      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v4 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz" # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.2.0" # Required when rm_cmd is 'rmz'
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: ${{ inputs.version }}
          sublevel: ${{ inputs.sublevel }}
          kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
          anykernel3_commit: ${{ inputs.anykernel3_commit }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Spoof /proc/config.gz With Stock Config
        uses: ./.github/actions/stock-config
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          stock_config_dir: stock-configs

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -x
          # Hardcode the build timestamp to the 5th day of the patch level
          # at 04:20 UTC, using the existing timestamp formats expected by the build.
          OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"
          if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
            if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
              OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
            else
              OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
            fi
          else
            OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
          fi
          FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
          SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          # Keep git metadata aligned with the same fixed timestamp.
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Reject KowSU with SUSFS
        if: inputs.root_flavor == 'kowsu' && (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All')
        shell: bash
        run: |
          echo "ERROR: KowSU does not work together with SUSFS — re-run with SUSFS off." >&2
          exit 1

      - name: Reject FinaSU without SUSFS
        # FinaSU's kernel hard-depends on the susfs headers and its supercall
        # dispatch references susfs symbols unguarded, so a susfs-less build
        # cannot link. Unlike KernelSU/BakaSU there is no susfs-free shape.
        if: inputs.root_flavor == 'finasu' && !contains(inputs.feature_set, 'SUSFS')
        shell: bash
        run: |
          echo "ERROR: FinaSU requires SUSFS — re-run with SUSFS on." >&2
          exit 1

      - name: Setup Selected Root Implementation
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/root-setup
        with:
          flavor: ${{ inputs.root_flavor }}
          commit: ${{ inputs.root_commit }}

      - name: Mark No Root build metadata
        if: inputs.root_flavor == 'none'
        shell: bash
        run: |
          {
            echo "ROOT_IMPLEMENTATION=none"
            echo "ROOT_MANAGER=N/A"
            echo "ROOT_VERSION=N/A"
            echo "ROOT_COMMIT=N/A"
          } >> "$GITHUB_ENV"

      - name: Disable SUSFS for BakaSU without SUSFS feature
        if: inputs.root_flavor == 'bakasu' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: Disable SUSFS for SukiSU-Ultra without SUSFS feature
        if: inputs.root_flavor == 'sukisu-ultra' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: 6.18 exports the ipc_ns symbols rust_binder needs
        # android17-6.18's gki_defconfig builds CONFIG_ANDROID_BINDER_IPC_RUST=m
        # and the Rust driver references init_ipc_ns / put_ipc_ns, which this
        # tree does not export, so modpost fails:
        #   ERROR: modpost: "put_ipc_ns" [drivers/android/binder/rust_binder.ko] undefined!
        # Turning the module off is NOT an option - Kleaf's GKI target expects
        # drivers/android/binder/rust_binder.ko in its outputs and the build dies
        # with "Unable to find drivers/android/binder/rust_binder.ko in any of
        # the following directories". Export both symbols instead (GPL-only).
        if: inputs.version == 'android17-6.18'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          python3 "${{ github.workspace }}/.github/scripts/binder_ipc_ns_exports.py" "$PWD"

      - name: Single manager for BakaSU (multi-manager off)
        # BakaSU's Kconfig ships CONFIG_KSU_MULTI_MANAGER_SUPPORT=y, which
        # compiles three rows into apk_sign_keys[]: its own key plus
        # tiann/KernelSU's and KOWX712/KernelSU's, with an optional custom row
        # under EXPECTED_SIZE. Turning it off leaves exactly one row -
        # EXPECTED_SIZE_BAKASU / EXPECTED_HASH_BAKASU (0x377 / d3469712…), which
        # is the key their main-branch manager APK is signed with (checked
        # against run 41207077584), so the manager we ship stays trusted.
        if: inputs.root_flavor == 'bakasu'
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_MULTI_MANAGER_SUPPORT=n

      - name: Enable KernelSU toolkit support for BakaSU
        # BakaSU's ksu_toolkit interface (backslashxx/ksu_toolkit), off upstream.
        # Adds sys_reboot extensions behind a uid-0 check in
        # kernel/supercall/supercall.c:114-118: CHANGE_MANAGER_UID,
        # CHANGE_KSUVER, CHANGE_SPOOF_UNAME, CHANGE_KSUFLAGS. It does not add a
        # trusted signature - the toolkit slot is registered at runtime by a
        # root process (ksu_register_manager, index 253) - so the single-manager
        # guarantee from the step above is unaffected.
        if: inputs.root_flavor == 'bakasu'
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_TOOLKIT_SUPPORT=y

      - name: Single manager for SukiSU-Ultra (trim cert table)
        # SukiSU hardcodes seven trusted manager certificates in
        # kernel/manager/apk_sign.c (SukiSU, RKSU, KSU, WKSU, KowSU, KSUN, MKSU)
        # and is_manager_apk() accepts the first match - no flags, no Kconfig,
        # no Kbuild knob. The signature-fallback crowner in
        # kernel/extension/dynamic_sig_fallback.c reuses is_manager_apk(), so
        # trimming to one row narrows that path too. We keep SukiSU's own cert
        # (0x35c / 947ae944…), the key the manager APK we ship is signed with.
        # The script self-verifies and exits 1 if the table shape changes.
        if: inputs.root_flavor == 'sukisu-ultra'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/.github/scripts/trim_sukisu_managers.py" SukiSU-Ultra

      - name: Single manager for FinaSU (dynamic manager off)
        # Upstream ships CONFIG_KSU_DYNAMIC_MANAGER=y, which compiles a
        # nine-row signature table: FINASU_TRUSTED_* as the only trusted row
        # plus KernelSU/KowSU/KernelSU-Next/ReSukiSU/SukiSU/MKSU/RKSU/xxKSU as
        # recognition-only presets the user can authorise at runtime. We want
        # one manager and no runtime path to add another, so disable it: the
        # classic two-slot table compiles instead, and with slot 1 replaced by
        # the FinaSU cert (see the SUSFS action) that table is a single trusted
        # entry. dynamic_manager.o still builds - FinaSU guards that file with
        # no CONFIG symbol - it is simply no longer reachable from apk_sign.c.
        if: inputs.root_flavor == 'finasu'
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_DYNAMIC_MANAGER=n

      - name: SUSFS
        # One step, one action: resolve the SUSFS commit, apply it for the
        # selected root, then run the post-patch fixes (ksu_close_fd restore,
        # selinux_hide 6.6+ shim). All of that lives in
        # .github/actions/susfs/action.yml - the workflow no longer carries
        # SUSFS shell code.
        uses: ./.github/actions/susfs
        with:
          enabled: ${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All' }}
          susfs_commit: ${{ inputs.susfs_commit }}
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ inputs.root_flavor }}

      - name: Baseband Guard
        if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All')
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
        uses: ./.github/actions/networking
        with:
          os_patch_level: ${{ inputs.os_patch_level }}
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: DroidSpaces-OSS Patches
        if: contains(inputs.feature_set, 'DS') || inputs.feature_set == 'All'
        uses: ./.github/actions/droidspaces
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          droidspaces_commit: ${{ inputs.droidspaces_commit }}

      - name: Apply NTSync Patches
        if: contains(inputs.feature_set, 'NTSync')
        uses: ./.github/actions/ntsync
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        if: contains(inputs.feature_set, 'Ptrace')
        uses: ./.github/actions/ptrace
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Unicode Fix Patch
        if: contains(inputs.feature_set, 'Unicode')
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Performance Patches
        uses: ./.github/actions/performance
        if: contains(inputs.feature_set, 'Perf')
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Setup Misc Configs
        uses: ./.github/actions/misc
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          variant: ${{ inputs.variant }}

      - name: Enable BPF Stack (BTF + eBPF + FUSE-BPF)
        if: contains(inputs.feature_set, 'BPF')
        uses: ./.github/actions/btf
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Integrate NoMount
        if: contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All'
        uses: ./.github/actions/nomount
        with:
          commit: ${{ inputs.nomount_commit }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: ${{ inputs.variant }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          version: ${{ inputs.version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          brand_name: ${{ inputs.brand_name }}
          keep_kmi: ${{ inputs.keep_kmi }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: Initialize Config Fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Apply Kernel Bypass Hack
        if: ${{ inputs.allow_version_mismatch }}
        uses: ./.github/actions/bypass-kernel
        with:
          version: ${{ inputs.version }}
          allow_version_mismatch: true

      - name: Apply GB nomedia mtime FUSE fixup
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          echo '' | base64 -d >> fs/susfs.c
          perl -0777 -i -pe 's/(int err = inode->i_op->getattr\(mnt_userns, path, stat,\s*request_mask, query_flags\);\s*if \(!err\) \{)/$1\n\t\t\t{ extern void susfs_sus_kstat_fuse_fixup_times(struct kstat *stat); if (susfs_is_current_app_uid()) susfs_sus_kstat_fuse_fixup_times(stat); }/' fs/stat.c
          grep -q "susfs_sus_kstat_fuse_fixup_times(struct kstat" fs/susfs.c || { echo FAIL-helper; exit 1; }
          grep -q "susfs_sus_kstat_fuse_fixup_times(stat);" fs/stat.c || { echo FAIL-call; exit 1; }
          echo "GB nomedia mtime FUSE fixup applied"

      - name: Apply GB login-seal uptime (monotonic/boottime) spoof
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          # Rides the PROVEN sus_kstat path (same fs/susfs.c the .nomedia fix edits): a sentinel
          # kstat entry (spoofed_ino == GB_UPTIME_SENTINEL_INO) carries the per-uid clock offsets;
          # susfs_add_sus_kstat() arms the globals, susfs_spoof_uptime() applies them in the
          # clock_gettime syscall path. No new supercall / no LKM / no dispatch edit.
          echo '' | base64 -d > /tmp/gbu_globals.c
          echo '' | base64 -d > /tmp/gbu_sentinel.c
          echo '' | base64 -d >> fs/susfs.c
          perl -0777 -i -pe 'BEGIN{open my $f,"<","/tmp/gbu_globals.c" or die; local $/; our $g=<$f>} s/(void susfs_add_sus_kstat\(void __user \*\*user_info\) \{)/$g$1/' fs/susfs.c
          perl -0777 -i -pe 'BEGIN{open my $f,"<","/tmp/gbu_sentinel.c" or die; local $/; our $s=<$f>} s/(void susfs_add_sus_kstat\(void __user \*\*user_info\) \{.*?goto out_copy_to_user;\r?\n\t\})/$1$s/s' fs/susfs.c
          perl -0777 -i -pe 's/(if \(!error && put_timespec64\(&kernel_tp, tp\)\))/{ extern void susfs_spoof_uptime(const clockid_t which_clock, struct timespec64 *ts); if (!error) susfs_spoof_uptime(which_clock, &kernel_tp); }\n\t$1/' kernel/time/posix-timers.c
          grep -q "GB_UPTIME_SENTINEL_INO 990001112" fs/susfs.c                               || { echo FAIL-globals;  exit 1; }
          grep -q "gb_uptime_enabled = (gb_uptime_uid != 0)" fs/susfs.c                         || { echo FAIL-sentinel; exit 1; }
          grep -q "void susfs_spoof_uptime(const clockid_t" fs/susfs.c                          || { echo FAIL-spoofer;  exit 1; }
          grep -q "susfs_spoof_uptime(which_clock, &kernel_tp);" kernel/time/posix-timers.c     || { echo FAIL-call;     exit 1; }
          echo "GB login-seal uptime spoof applied (sentinel sus_kstat)"

      - name: Build Normal Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          KBUILD_BUILD_USER: ${{ (inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12' || inputs.version == 'android17-6.18') && 'kleaf' || 'build-user' }}
          KBUILD_BUILD_HOST: build-host
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}

      - name: Consolidated Build Summary
        id: build-summary
        if: always()
        uses: ./.github/actions/build-summary
        with:
          job_status: ${{ job.status }}
          file_name: ${{ steps.extract.outputs.file_name }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          android_version: ${{ inputs.android_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          susfs_commit: ${{ inputs.susfs_commit }}

      - name: Upload Artifacts
        id: kernel-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Write Build-verified only artifact metadata
        if: success() && inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/build-metadata
        with:
          summary_base: ${{ steps.build-summary.outputs.summary_base }}
          file_name: ${{ steps.extract.outputs.file_name }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          page_size: ${{ inputs.page_size }}

      - name: Upload Build Summary + Metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-BuildInfo
          path: /tmp/build-summary-${{ steps.build-summary.outputs.summary_base }}.md
          if-no-files-found: warn
          compression-level: 9
